<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<!-- frame-ancestors is delivered via the HTTP response header (it is ignored in a <meta> tag);
     keeping it out of here avoids a benign console error while the header still enforces it. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:5757; img-src 'self' data:; base-uri 'none'; form-action 'self'"/>
<title>AEGIS · PreFlight</title>
<!-- inline data-URI favicon avoids a /favicon.ico 404 in the console (no external asset) -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>"/>
<style>
  :root{
    --bg:#0b0f17; --panel:#121826; --panel2:#0e1422; --line:#1f2a3d;
    --ink:#e6edf6; --mut:#8a99b0; --acc:#3da9fc; --accd:#1b6fb3;
    --ok:#2ecc71; --warn:#f5a623; --bad:#ff5c5c; --chip:#1a2436;
    --mono:'SF Mono',ui-monospace,'Cascadia Code',Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
  header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;
         align-items:center;gap:14px;background:var(--panel2);}
  header h1{font-size:18px;margin:0;letter-spacing:.5px}
  header .tag{font-size:11px;color:var(--mut);border:1px solid var(--line);
              padding:2px 8px;border-radius:20px}
  header .egress{margin-left:auto;font-size:11px;color:var(--ok);
                 border:1px solid var(--ok);padding:2px 10px;border-radius:20px}
  .wrap{max-width:1180px;margin:0 auto;padding:22px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
  input,select,button,textarea{font:inherit}
  .intent{flex:1;min-width:320px;background:var(--panel);border:1px solid var(--line);
          color:var(--ink);border-radius:10px;padding:11px 14px;}
  select{background:var(--panel);border:1px solid var(--line);color:var(--ink);
         border-radius:10px;padding:11px 12px}
  button{background:var(--acc);border:none;color:#04121f;font-weight:600;
         border-radius:10px;padding:11px 20px;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .steps{display:flex;gap:6px;margin:8px 0 20px;flex-wrap:wrap}
  .steps .s{font-size:11px;color:var(--mut);background:var(--chip);
            border:1px solid var(--line);padding:4px 9px;border-radius:6px}
  .steps .s.on{color:var(--acc);border-color:var(--accd)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
        padding:16px 18px;min-height:120px}
  .card h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;
           letter-spacing:1px;color:var(--mut)}
  pre{font:12px/1.45 var(--mono);background:var(--panel2);border:1px solid var(--line);
      border-radius:8px;padding:10px;overflow:auto;white-space:pre-wrap;margin:6px 0}
  .verdict{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px}
  .dot{width:12px;height:12px;border-radius:50%}
  .ship .dot{background:var(--ok)} .ship{color:var(--ok)}
  .block .dot{background:var(--bad)} .block{color:var(--bad)}
  .appr .dot{background:var(--warn)} .appr{color:var(--warn)}
  .kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);
      padding:5px 0;font-size:13px}
  .kv b{font-weight:600}
  .chip{display:inline-block;font:11px var(--mono);padding:3px 8px;border-radius:6px;
        margin:3px 4px 0 0;border:1px solid var(--line)}
  .chip.pass{color:var(--ok);border-color:#1f5d3a;background:#0f1f17}
  .chip.fail{color:var(--bad);border-color:#5d2222;background:#1f0f0f}
  .chip.na{color:var(--mut);border-color:#3a3f4d;background:#161b27}
  .dev{font:12px var(--mono);color:var(--mut);margin-top:4px}
  .foot{margin-top:18px;font:11px var(--mono);color:var(--mut);
        border-top:1px solid var(--line);padding-top:10px;word-break:break-all}
  .muted{color:var(--mut)}
  .err{color:var(--bad)}
</style>
</head>
<body>
<header>
  <h1>AEGIS · <span style="color:var(--acc)">PreFlight</span></h1>
  <span class="tag">air-gapped change validation</span>
  <span class="egress">● egress: none</span>
</header>

<div class="wrap">
  <div class="bar">
    <select id="source">
      <option value="nl_intent">intent</option>
      <option value="config_import">paste config</option>
    </select>
    <input id="intent" class="intent"
           placeholder="Describe a change…  e.g. add VLAN 40 to leaf-2 and peer BGP"
           value="add VLAN 40 to leaf-2 and peer BGP"/>
    <select id="vendor" style="display:none">
      <option value="frr">frr</option>
      <option value="srlinux">srlinux</option>
      <option value="ceos">ceos</option>
      <option value="junos">junos</option>
      <option value="ios">ios</option>
      <option value="panos">panos</option>
    </select>
    <select id="lab" title="reference twin topology">
      <option value="clos-evpn">clos-evpn</option>
      <option value="dcn-10node">dcn-10node</option>
      <option value="edge-slice">edge-slice (junos+ios)</option>
      <option value="single">single</option>
    </select>
    <input id="changeRef" placeholder="change ref (e.g. CHG0012345)" maxlength="64"
           title="ITSM change number — sealed into the bundle; required in production mode"
           style="width:13em"/>
    <input id="apiKey" type="password" placeholder="API key (if required)" autocomplete="off"
           title="X-Aegis-Key — kept in this tab's sessionStorage only" style="width:11em"/>
    <select id="mode" title="sim = offline demo (zero deps) · live = operator/air-gapped path (needs API key + self-hosted LLM + containerlab)">
      <option value="sim">sim</option>
      <option value="live">live</option>
    </select>
    <button id="go">Run PreFlight ▸</button>
  </div>
  <textarea id="configText" style="display:none;width:100%;min-height:120px;
    background:var(--panel);border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:11px 14px;font:12px/1.45 var(--mono);margin-bottom:8px"
    placeholder="Paste a sanitized running-config snippet…  (no LLM touches this path)"></textarea>

  <div class="steps" id="steps">
    <span class="s" data-k="guard">guard</span>
    <span class="s" data-k="generate">generate (LLM)</span>
    <span class="s" data-k="batfish">batfish</span>
    <span class="s" data-k="twin">twin</span>
    <span class="s" data-k="diff">diff</span>
    <span class="s" data-k="compliance">compliance</span>
    <span class="s" data-k="verdict">verdict</span>
    <span class="s" data-k="evidence">evidence</span>
  </div>

  <div class="grid">
    <div class="card" id="c-verdict"><h3>Verdict</h3><div class="muted">Run a change to begin.</div></div>
    <div class="card" id="c-twin"><h3>Digital twin</h3><div class="muted">—</div></div>
    <div class="card" id="c-config"><h3>Generated config (grounded)</h3><div class="muted">—</div></div>
    <div class="card" id="c-evidence"><h3>Evidence &amp; compliance</h3><div class="muted">—</div></div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script src="/preflight.js"></script>
</body>
</html>
