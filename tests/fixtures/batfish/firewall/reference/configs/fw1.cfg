#RANCID-CONTENT-TYPE: juniper
set system host-name fw1
set interfaces ge-0/0/0 unit 0 family inet address 10.1.0.1/24
set interfaces ge-0/0/1 unit 0 family inet address 203.0.113.1/24
set interfaces ge-0/0/2 unit 0 family inet address 10.2.0.1/24
set security zones security-zone trust interfaces ge-0/0/0.0
set security zones security-zone untrust interfaces ge-0/0/1.0
set security zones security-zone dmz interfaces ge-0/0/2.0
set security policies from-zone trust to-zone untrust policy out match source-address any
set security policies from-zone trust to-zone untrust policy out match destination-address any
set security policies from-zone trust to-zone untrust policy out match application any
set security policies from-zone trust to-zone untrust policy out then permit
set security policies from-zone untrust to-zone dmz policy web match source-address any
set security policies from-zone untrust to-zone dmz policy web match destination-address any
set security policies from-zone untrust to-zone dmz policy web match application junos-https
set security policies from-zone untrust to-zone dmz policy web then permit
set security nat source rule-set out from zone trust
set security nat source rule-set out to zone untrust
set security nat source rule-set out rule r1 match source-address 10.1.0.0/24
set security nat source rule-set out rule r1 then source-nat interface
set security nat destination pool web address 10.2.0.10/32
set security nat destination rule-set in from zone untrust
set security nat destination rule-set in rule r1 match destination-address 203.0.113.10/32
set security nat destination rule-set in rule r1 then destination-nat pool web
