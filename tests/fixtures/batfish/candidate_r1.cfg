!
hostname r1
!
interface GigabitEthernet0/0
 description CDE
 ip address 10.10.0.1 255.255.255.0
!
interface GigabitEthernet0/1
 description GUEST
 ip address 10.50.0.1 255.255.0.0
 ip access-group GUEST_IN in
!
interface GigabitEthernet0/2
 description WEB
 ip address 10.20.0.1 255.255.255.0
!
interface GigabitEthernet0/3
 description LAB
 ip address 10.99.0.1 255.255.255.0
 ip access-group LAB_IN in
!
ip access-list extended GUEST_IN
 permit tcp 10.50.0.0 0.0.255.255 10.10.0.0 0.0.0.255 eq 22
 deny   ip 10.50.0.0 0.0.255.255 10.10.0.0 0.0.0.255
 permit ip any any
 deny   tcp any any eq 23
!
end
