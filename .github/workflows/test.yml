name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # check out INTO an `aegis/` dir so `python -m aegis.*` resolves from the parent
      - uses: actions/checkout@v4
        with:
          path: aegis

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r aegis/requirements.txt

      # run from the workspace root (the parent of aegis/)
      - name: Pipeline invariants (25k, 8 invariants, adversarial + concurrency)
        run: python -m aegis.tests.stress_test 25000

      - name: HttpBackend contract (parsers vs real :5757 shapes)
        run: python -m aegis.tests.contract_test

      - name: Evidence PDF validity (1k bundles)
        run: python -m aegis.tests.pdf_test 1000

      - name: Phase 2 promotion-gate safety (6k bundles)
        run: python -m aegis.tests.promote_test 6000
